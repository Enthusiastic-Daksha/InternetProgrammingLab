<!DOCTYPE html>
<html>
<head>
    <title>TrendNest - Register</title>
</head>

<body style="background-color:#FFF8DC;font-family:Georgia;">

<h1 style="text-align:center;color:darkblue;text-shadow:2px 2px lightgray;">
TrendNest Registration
</h1>

<form action="login.html"
style="width:400px;
margin:auto;
padding:20px;
border:2px solid navy;
background-color:lightyellow;">

<label>Full Name</label><br><br>
<input type="text" size="40"
style="padding:5px;border:2px solid black;"><br><br>

<label>Email</label><br><br>
<input type="email" size="40"
style="padding:5px;border:2px solid black;"><br><br>

<label>Mobile Number</label><br><br>
<input type="tel" size="40"
style="padding:5px;border:2px solid black;"><br><br>

<label>Password</label><br><br>
<input type="password" size="40"
style="padding:5px;border:2px solid black;"><br><br>

<label>Confirm Password</label><br><br>
<input type="password" size="40"
style="padding:5px;border:2px solid black;"><br><br>

<label>Gender</label><br><br>

<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female

<br><br>

<label>City</label><br><br>

<select style="padding:5px;border:2px solid black;">

<option>Madurai</option>
<option>Chennai</option>
<option>Coimbatore</option>
<option>Trichy</option>

</select>

<br><br>

<input type="checkbox">
I Accept Terms and Conditions

<br><br>

<input type="submit"
value="Register"
style="background-color:darkblue;
color:white;
padding:8px 20px;
border:2px solid black;">

<input type="reset"
value="Clear"
style="background-color:red;
color:white;
padding:8px 20px;
border:2px solid black;">

</form>

<p style="text-align:center;">
Already have an account?
<a href="login.html">Login</a>
</p>

<hr>

<p style="text-align:center;">
&copy; 2026 TrendNest Online Shopping
</p>

</body>
</html>
