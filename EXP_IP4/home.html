<!DOCTYPE html>
<html>
<head>

<title> Registration</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h2 id="heading">Job Portal Registration</h2>

<form id="registrationForm">

<label>Full Name</label>
<input type="text" id="fullName">
<div class="error" id="fullNameError"></div>

<label>Email Address</label>
<input type="text" id="email" placeholder="Enter Email">
<div class="error" id="emailError"></div>

<label>Phone Number</label>
<input type="text" id="phone" placeholder="10 Digit Number">
<div class="error" id="phoneError"></div>

<label>Password</label>
<input type="password" id="password" placeholder="Minimum 6 Characters">
<div class="error" id="passwordError"></div>

<label>Qualification</label>
<select id="qualification">
<option value="">Select Qualification</option>
<option>B.E</option>
<option>B.Tech</option>
<option>B.Sc</option>
<option>BCA</option>
<option>MCA</option>
<option>M.Tech</option>
</select>
<div class="error" id="qualificationError"></div>

<label>Desired Job Title</label>
<input type="text" id="jobTitle" placeholder="Web Developer">
<div class="error" id="jobTitleError"></div>

<label>Years of Experience</label>
<input type="number" id="experience" placeholder="0">
<div class="error" id="experienceError"></div>

<label>Resume Link</label>
<input type="text" id="resumeLink" placeholder="https://example.com">
<div class="error" id="resumeLinkError"></div>

<label>Upload Resume</label>
<input type="file" id="resumeFile" accept=".pdf,.doc,.docx">
<div class="error" id="resumeFileError"></div>

<button type="submit">Register</button>

<div id="successMsg"></div>

</form>

</div>

<script src="script.js"></script>

</body>
</html>
