<!DOCTYPE html>
<html>

<head>

    <title>Student Details</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="header">

        <h1>Online Examination System</h1>

    </div>


    <div class="details-box">

        <h2>Student Basic Details</h2>


        <form onsubmit="return saveStudentDetails()">


            <label>Student Name:</label>

            <input
                type="text"
                id="studentName"
                placeholder="Enter your name"
            >

            <br><br>


            <label>Register Number:</label>

            <input
                type="text"
                id="registerNumber"
                placeholder="Enter register number"
            >

            <br><br>


            <label>Department:</label>

            <select id="department">

                <option value="">
                    Select Department
                </option>

                <option value="CSE">
                    CSE
                </option>

                <option value="ECE">
                    ECE
                </option>

                <option value="EEE">
                    EEE
                </option>

                <option value="IT">
                    IT
                </option>

                <option value="MECH">
                    MECH
                </option>

            </select>

            <br><br>


            <label>Year:</label>

            <select id="year">

                <option value="">
                    Select Year
                </option>

                <option value="1st Year">
                    1st Year
                </option>

                <option value="2nd Year">
                    2nd Year
                </option>

                <option value="3rd Year">
                    3rd Year
                </option>

                <option value="4th Year">
                    4th Year
                </option>

            </select>

            <br><br>


            <label>Email:</label>

            <input
                type="email"
                id="email"
                placeholder="Enter email"
            >

            <br><br>


            <label>College:</label>

            <input
                type="text"
                id="college"
                placeholder="Enter college name"
            >

            <br><br>


            <div class="details-buttons">

                <input
                    type="submit"
                    value="Continue to Exam"
                >

                <input
                    type="reset"
                    value="Clear"
                >

            </div>


        </form>


        <p id="detailsMessage"></p>

    </div>


    <script src="script.js"></script>

</body>

</html>
